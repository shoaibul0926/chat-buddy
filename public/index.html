<title>Chat Buddy</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: Arial, Helvetica, sans-serif;
    padding: 12px;
  }

  #app {
    --bg: #ffffff;
    --bg-secondary: #f4f4f8;
    --text: #222222;
    --text-secondary: #6b6b76;
    --border: #e0e0e6;
    --bubble-bot-bg: #e5e5ea;
    --bubble-bot-text: #000000;
    --bubble-user-bg: #764ba2;
    --bubble-user-text: #ffffff;
    --accent: #764ba2;
    --accent-hover: #5f3d8a;
    --sidebar-bg: #f7f5fb;
    --sidebar-hover: #ece7f5;
    --sidebar-active: #e2d9f3;
    --input-bg: #ffffff;
    --input-border: #cccccc;
    --overlay-bg: #ffffff;

    width: 380px;
    max-width: 100%;
    height: 560px;
    max-height: 90dvh;
    background: var(--bg);
    color: var(--text);
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: row;
    overflow: hidden;
    position: relative;
  }

  #app[data-theme="dark"] {
    --bg: #1c1c26;
    --bg-secondary: #15151d;
    --text: #e8e8ee;
    --text-secondary: #9a9aab;
    --border: #34343f;
    --bubble-bot-bg: #2c2c3a;
    --bubble-bot-text: #eeeeee;
    --bubble-user-bg: #8a63c8;
    --bubble-user-text: #ffffff;
    --accent: #8a63c8;
    --accent-hover: #9d7cd4;
    --sidebar-bg: #16161f;
    --sidebar-hover: #232330;
    --sidebar-active: #2c2c40;
    --input-bg: #22222e;
    --input-border: #3a3a48;
    --overlay-bg: #1c1c26;
  }

  #app.with-sidebar {
    width: 720px;
    height: 600px;
    max-height: 92dvh;
  }

  @media (max-width: 480px) {
    body { padding: 0; }
    #app {
      width: 100vw;
      height: 100dvh;
      max-height: 100dvh;
      border-radius: 0;
    }
    #app.with-sidebar {
      width: 100vw;
    }
  }

  @media (max-width: 767px) {
    #app.with-sidebar {
      width: 100vw;
      height: 100dvh;
      max-height: 100dvh;
      border-radius: 0;
    }
    #app.with-sidebar #sidebar {
      position: absolute;
      inset: 0;
      z-index: 25;
      width: 100%;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    #app.with-sidebar #sidebar.mobile-open {
      transform: translateX(0);
    }
  }

  /* ---------- Sidebar ---------- */

  #sidebar {
    display: none;
    flex-direction: column;
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
  }

  #app.with-sidebar #sidebar {
    display: flex;
  }

  #sidebarHeader {
    padding: 14px 12px 8px;
    flex-shrink: 0;
  }

  #sidebarBrand {
    font-weight: bold;
    font-size: 15px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  #newChatBtn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 8px;
  }

  #newChatBtn:hover { background: var(--accent-hover); }

  #sidebarSearch {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    border-radius: 8px;
    font-size: 12px;
    outline: none;
  }

  #searchResults {
    padding: 0 12px;
    max-height: 160px;
    overflow-y: auto;
    flex-shrink: 0;
    display: none;
  }

  #searchResults.visible { display: block; }

  .search-result {
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    margin-bottom: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .search-result:hover { background: var(--sidebar-hover); }
  .search-result .sr-title { font-weight: bold; color: var(--accent); display: block; }
  .search-result .sr-snippet { color: var(--text-secondary); }

  #sidebarList {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 8px;
  }

  .folder-group { margin-bottom: 6px; }

  .folder-header {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 6px;
    font-size: 11px;
    font-weight: bold;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 6px;
  }

  .folder-header:hover { background: var(--sidebar-hover); }

  .folder-header .folder-actions { margin-left: auto; display: flex; gap: 2px; }
  .folder-header button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 11px;
    opacity: 0.7;
    padding: 2px 4px;
  }
  .folder-header button:hover { opacity: 1; }

  .folder-children { padding-left: 10px; }

  .conv-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 8px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    font-size: 12px;
  }

  .conv-item:hover { background: var(--sidebar-hover); }
  .conv-item.active { background: var(--sidebar-active); }

  .conv-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conv-title-input {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: var(--input-bg);
    color: var(--text);
  }

  .conv-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
    opacity: 0.55;
  }

  .conv-item:hover .conv-actions,
  .conv-item:focus-within .conv-actions {
    opacity: 1;
  }

  .conv-actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 11px;
    padding: 2px 3px;
    border-radius: 4px;
  }

  .conv-actions button:hover { background: rgba(0,0,0,0.1); }

  .conv-actions .delete-confirm {
    background: #e0405a;
    color: white;
  }

  #newFolderRow {
    padding: 4px 6px;
  }

  #newFolderBtn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    padding: 6px;
  }
  #newFolderBtn:hover { color: var(--accent); }

  #newFolderInput {
    width: 100%;
    font-size: 11px;
    padding: 5px 8px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }

  #sidebarFooter {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  #sidebarFooter:hover { background: var(--sidebar-hover); }

  #profileAvatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  #profileName {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    font-weight: bold;
  }

  /* ---------- Chat pane ---------- */

  #chatPane {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--accent);
    color: white;
    padding: 14px 62px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    position: relative;
    flex-shrink: 0;
  }

  #sidebarToggleBtn {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 14px;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: none;
  }

  @media (max-width: 767px) {
    #app.with-sidebar #sidebarToggleBtn { display: block; }
  }

  #clearBtn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 12px;
    cursor: pointer;
  }

  #clearBtn:hover {
    background: rgba(255,255,255,0.35);
  }

  #chatTitle {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #messages {
    flex: 1;
    min-height: 0;
    padding: 12px;
    overflow-y: auto;
    background: var(--bg-secondary);
  }

  .msg {
    max-width: 75%;
    margin: 6px 0;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .time {
    display: block;
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: #888;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  .bot {
    background: var(--bubble-bot-bg);
    color: var(--bubble-bot-text);
    border-bottom-left-radius: 4px;
    margin-right: auto;
  }

  .user {
    background: var(--bubble-user-bg);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
    margin-left: auto;
  }

  #inputArea {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
    padding: 8px 10px 10px;
    gap: 8px;
    flex-shrink: 0;
  }

  #toolRow {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  #toolRow button {
    flex-shrink: 0;
  }

  #textRow {
    display: flex;
    gap: 8px;
  }

  #userInput {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    border-radius: 20px;
    font-size: 16px;
    outline: none;
  }

  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #sendBtn:hover {
    background: var(--accent-hover);
  }

  #attachBtn, #videoAttachBtn, #webcamBtn, #docAttachBtn, #micBtn {
    background: var(--bubble-bot-bg);
    color: var(--text);
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  #attachBtn:hover, #videoAttachBtn:hover, #webcamBtn:hover, #docAttachBtn:hover, #micBtn:hover {
    filter: brightness(0.92);
  }

  .preview-btn {
    margin-top: 6px;
    padding: 6px 12px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: white;
    cursor: pointer;
    font-size: 12px;
  }

  .preview-btn:hover {
    background: var(--accent-hover);
  }

  .file-preview-text {
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    font-size: 12px;
    margin-top: 6px;
    background: rgba(128,128,128,0.15);
    padding: 8px;
    border-radius: 8px;
  }

  #micBtn.listening {
    background: #e0405a;
    color: white;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,64,90,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(224,64,90,0); }
  }

  .msg img, .msg video {
    max-width: 100%;
    max-height: 180px;
    border-radius: 10px;
    display: block;
    margin-bottom: 4px;
  }

  #webcamOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
  }

  #webcamOverlay video {
    width: 88%;
    border-radius: 10px;
    background: #000;
  }

  .webcam-controls {
    display: flex;
    gap: 10px;
  }

  .webcam-controls button {
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }

  #captureBtn {
    background: var(--accent);
    color: white;
  }

  #captureBtn:hover {
    background: var(--accent-hover);
  }

  #cancelWebcamBtn {
    background: #e5e5ea;
    color: #333;
  }

  #cancelWebcamBtn:hover {
    background: #d6d6db;
  }

  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 6px;
    border: 1px solid rgba(128,128,128,0.4);
  }

  .subtitle {
    font-size: 10px;
    font-weight: normal;
    opacity: 0.8;
    margin-top: 2px;
  }

  .agent-trace {
    background: #f0eaf9 !important;
    color: #5a3d80 !important;
    font-size: 12px;
    font-style: italic;
    border: 1px dashed #c9b6e6;
  }

  #app[data-theme="dark"] .agent-trace {
    background: #2a2140 !important;
    color: #cbb3ec !important;
    border: 1px dashed #4d3a70;
  }

  .agent-trace div {
    margin: 2px 0;
  }

  /* ---------- Auth overlay ---------- */

  #authOverlay {
    position: absolute;
    inset: 0;
    background: var(--overlay-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 30px;
    z-index: 20;
  }

  #authOverlay h2 {
    margin: 0 0 4px;
    color: var(--accent);
  }

  #authOverlay input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }

  #authOverlay input:focus {
    border-color: var(--accent);
  }

  #authForm {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #authSubmitBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }

  #authSubmitBtn:hover {
    background: var(--accent-hover);
  }

  #authSubmitBtn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  #authToggle {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }

  #authError {
    color: #c0392b;
    font-size: 13px;
    min-height: 16px;
    text-align: center;
  }

  /* ---------- Settings overlay ---------- */

  #settingsOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 16px;
  }

  #settingsOverlay.open { display: flex; }

  #settingsCard {
    background: var(--bg);
    color: var(--text);
    border-radius: 12px;
    width: 100%;
    max-width: 320px;
    max-height: 90%;
    overflow-y: auto;
    padding: 18px;
  }

  #settingsCard h3 {
    margin: 0 0 12px;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #closeSettingsBtn {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: var(--text-secondary);
  }

  .settings-section {
    margin-bottom: 16px;
  }

  .settings-label {
    font-size: 11px;
    font-weight: bold;
    color: var(--text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .settings-section input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    margin-bottom: 6px;
  }

  .avatar-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .avatar-option {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--bg-secondary);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-option.selected {
    border-color: var(--accent);
  }

  .theme-toggle {
    display: flex;
    gap: 8px;
  }

  .theme-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--input-border);
    background: var(--bg-secondary);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }

  .theme-btn.selected {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .settings-btn {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
  }

  .settings-btn:hover { background: var(--accent-hover); }

  .settings-btn.secondary {
    background: var(--bg-secondary);
    color: var(--text);
  }

  .settings-btn.danger {
    background: #e0405a;
  }

  .settings-msg {
    font-size: 12px;
    min-height: 14px;
    margin-top: 4px;
  }

  .settings-msg.error { color: #c0392b; }
  .settings-msg.ok { color: #2a9d5c; }
</style>

<div id="app">
  <div id="sidebar">
    <div id="sidebarHeader">
      <div id="sidebarBrand">🤖 Chat Buddy</div>
      <button id="newChatBtn">+ New Chat</button>
      <input id="sidebarSearch" type="text" placeholder="Search all chats..." autocomplete="off" />
    </div>
    <div id="searchResults"></div>
    <div id="sidebarList"></div>
    <div id="newFolderRow">
      <button id="newFolderBtn">+ New Folder</button>
    </div>
    <div id="sidebarFooter">
      <div id="profileAvatar">🤖</div>
      <div id="profileName">Account</div>
      <span style="font-size:12px; color:var(--text-secondary);">⚙️</span>
    </div>
  </div>

  <div id="chatPane">
    <header>
      <button id="sidebarToggleBtn">☰</button>
      <span id="chatTitle">🤖 Chat Buddy</span>
      <div class="subtitle">🧠 AI Agent Mode: multi-step tasks &amp; memory</div>
      <button id="clearBtn">Clear</button>
    </header>

    <div id="authOverlay">
      <h2>🤖 Chat Buddy</h2>
      <p style="margin:0; color:var(--text-secondary); font-size:13px;">Sign in to save your chats to your account</p>
      <form id="authForm">
        <input id="authUsername" type="text" placeholder="Username" autocomplete="username" required />
        <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" required />
        <div id="authError"></div>
        <button id="authSubmitBtn" type="submit">Login</button>
      </form>
      <button id="authToggle">Need an account? Register</button>
    </div>

    <div id="settingsOverlay">
      <div id="settingsCard">
        <h3>Settings <button id="closeSettingsBtn">✕</button></h3>

        <div class="settings-section">
          <div class="settings-label">Display name</div>
          <input id="settingsDisplayName" type="text" placeholder="Display name" />
        </div>

        <div class="settings-section">
          <div class="settings-label">Avatar</div>
          <div class="avatar-grid" id="avatarGrid"></div>
        </div>

        <div class="settings-section">
          <div class="settings-label">Theme</div>
          <div class="theme-toggle">
            <button class="theme-btn" id="themeLightBtn" type="button">☀️ Light</button>
            <button class="theme-btn" id="themeDarkBtn" type="button">🌙 Dark</button>
          </div>
        </div>

        <button class="settings-btn" id="saveProfileBtn">Save profile</button>
        <div class="settings-msg" id="profileMsg"></div>

        <div class="settings-section" style="margin-top:16px;">
          <div class="settings-label">Change password</div>
          <input id="currentPasswordInput" type="password" placeholder="Current password" />
          <input id="newPasswordInput" type="password" placeholder="New password (6+ chars)" />
        </div>
        <button class="settings-btn secondary" id="changePasswordBtn">Change password</button>
        <div class="settings-msg" id="passwordMsg"></div>

        <button class="settings-btn danger" id="settingsLogoutBtn" style="margin-top:16px;">Logout</button>
      </div>
    </div>

    <div id="messages"></div>
    <div id="inputArea">
      <div id="toolRow">
        <button id="attachBtn" title="Upload an image">📎</button>
        <input id="fileInput" type="file" accept="image/*" hidden />
        <button id="videoAttachBtn" title="Upload a video">🎥</button>
        <input id="videoFileInput" type="file" accept="video/*" hidden />
        <button id="webcamBtn" title="Take a photo with your webcam">📷</button>
        <button id="docAttachBtn" title="Upload a PDF, DOCX, or TXT file">📄</button>
        <input id="docFileInput" type="file" accept=".pdf,.docx,.txt" hidden />
        <button id="micBtn" title="Ask by voice">🎤</button>
      </div>
      <div id="textRow">
        <input id="userInput" type="text" placeholder="Type or paste a screenshot (Ctrl+V)..." autocomplete="off" />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const videoAttachBtn = document.getElementById('videoAttachBtn');
  const videoFileInput = document.getElementById('videoFileInput');
  const webcamBtn = document.getElementById('webcamBtn');
  const docAttachBtn = document.getElementById('docAttachBtn');
  const docFileInput = document.getElementById('docFileInput');
  const micBtn = document.getElementById('micBtn');
  const appEl = document.getElementById('app');
  const chatTitleEl = document.getElementById('chatTitle');

  let userFiles = [];

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const authOverlay = document.getElementById('authOverlay');
  const authForm = document.getElementById('authForm');
  const authUsername = document.getElementById('authUsername');
  const authPassword = document.getElementById('authPassword');
  const authError = document.getElementById('authError');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const authToggle = document.getElementById('authToggle');

  let userName = null;
  let notes = [];

  const TOKEN_KEY = 'chatBuddyToken';
  const MAX_HISTORY = 40;
  let history = [];
  let authToken = localStorage.getItem(TOKEN_KEY) || null;
  let authMode = 'login';

  // ---------- Phase 3 state: profile, folders, conversations ----------
  const AVATARS = ['🤖', '🦊', '🐼', '🐸', '🐙', '🦉', '🐳', '🦄', '🐝', '🦁'];
  let profile = { displayName: '', avatar: '🤖', theme: 'light' };
  let folders = [];
  let conversations = [];
  let currentConversationId = null;
  let collapsedFolders = new Set();

  const sidebar = document.getElementById('sidebar');
  const sidebarList = document.getElementById('sidebarList');
  const sidebarSearch = document.getElementById('sidebarSearch');
  const searchResultsEl = document.getElementById('searchResults');
  const newChatBtn = document.getElementById('newChatBtn');
  const newFolderBtn = document.getElementById('newFolderBtn');
  const newFolderRow = document.getElementById('newFolderRow');
  const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
  const profileAvatarEl = document.getElementById('profileAvatar');
  const profileNameEl = document.getElementById('profileName');
  const sidebarFooter = document.getElementById('sidebarFooter');

  const settingsOverlay = document.getElementById('settingsOverlay');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const settingsDisplayName = document.getElementById('settingsDisplayName');
  const avatarGrid = document.getElementById('avatarGrid');
  const themeLightBtn = document.getElementById('themeLightBtn');
  const themeDarkBtn = document.getElementById('themeDarkBtn');
  const saveProfileBtn = document.getElementById('saveProfileBtn');
  const profileMsg = document.getElementById('profileMsg');
  const currentPasswordInput = document.getElementById('currentPasswordInput');
  const newPasswordInput = document.getElementById('newPasswordInput');
  const changePasswordBtn = document.getElementById('changePasswordBtn');
  const passwordMsg = document.getElementById('passwordMsg');
  const settingsLogoutBtn = document.getElementById('settingsLogoutBtn');

  function authHeaders(json) {
    const h = { Authorization: 'Bearer ' + authToken };
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }

  function timestamp() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function applyTheme() {
    appEl.setAttribute('data-theme', profile.theme === 'dark' ? 'dark' : 'light');
  }

  function saveHistory() {
    if (!authToken || !currentConversationId) return;
    fetch('/api/conversations/' + currentConversationId, {
      method: 'PUT',
      headers: authHeaders(true),
      body: JSON.stringify({ history, userName, notes })
    }).then(() => {
      const conv = conversations.find(c => c.id === currentConversationId);
      if (conv) {
        conv.updatedAt = new Date().toISOString();
        const last = history[history.length - 1];
        conv.preview = last ? (last.text || '').slice(0, 60) : '';
        renderSidebar();
      }
    }).catch(e => console.warn('Could not save to server', e));
  }

  function pushHistory(entry) {
    history.push(entry);
    if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);
    saveHistory();
  }

  function addMessage(text, sender, opts = {}) {
    const time = opts.time || timestamp();
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    const timeEl = document.createElement('span');
    timeEl.className = 'time';
    timeEl.textContent = time;
    div.appendChild(timeEl);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    if (opts.save !== false) pushHistory({ type: 'text', sender, text, time });
  }

  function addImageMessage(dataUrl, sender, opts = {}) {
    const time = opts.time || timestamp();
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    const img = document.createElement('img');
    img.src = dataUrl;
    div.appendChild(img);
    const timeEl = document.createElement('span');
    timeEl.className = 'time';
    timeEl.textContent = time;
    div.appendChild(timeEl);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    if (opts.save !== false) pushHistory({ type: 'image', sender, dataUrl, time });
  }

  function addHtmlMessage(html, sender, opts = {}) {
    const time = opts.time || timestamp();
    const div = document.createElement('div');
    div.className = 'msg ' + sender + (opts.extraClass ? ' ' + opts.extraClass : '');
    div.innerHTML = html;
    const timeEl = document.createElement('span');
    timeEl.className = 'time';
    timeEl.textContent = time;
    div.appendChild(timeEl);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    if (opts.save !== false) pushHistory({ type: 'html', sender, html, time, extraClass: opts.extraClass });
  }

  function renderStoredEntry(entry) {
    const opts = { save: false, time: entry.time, extraClass: entry.extraClass };
    if (entry.type === 'text') addMessage(entry.text, entry.sender, opts);
    else if (entry.type === 'image') addImageMessage(entry.dataUrl, entry.sender, opts);
    else if (entry.type === 'html') addHtmlMessage(entry.html, entry.sender, opts);
  }

  function hydrateFromData(data) {
    messagesEl.innerHTML = '';
    userName = data.userName || null;
    notes = Array.isArray(data.notes) ? data.notes : [];
    history = Array.isArray(data.history) ? data.history : [];
    if (history.length === 0) {
      addMessage("Hi am your chatbot! what I can do for you", 'bot');
    } else {
      history.forEach(renderStoredEntry);
    }
  }

  function showApp() {
    authOverlay.style.display = 'none';
    appEl.classList.add('with-sidebar');
  }

  function showAuth(message) {
    authOverlay.style.display = 'flex';
    appEl.classList.remove('with-sidebar');
    messagesEl.innerHTML = '';
    authError.textContent = message || '';
  }

  function setAuthMode(mode) {
    authMode = mode;
    authError.textContent = '';
    if (mode === 'login') {
      authSubmitBtn.textContent = 'Login';
      authToggle.textContent = "Need an account? Register";
      authPassword.autocomplete = 'current-password';
    } else {
      authSubmitBtn.textContent = 'Register';
      authToggle.textContent = 'Already have an account? Login';
      authPassword.autocomplete = 'new-password';
    }
  }

  function setToken(token) {
    authToken = token;
    localStorage.setItem(TOKEN_KEY, token);
  }

  function logout() {
    authToken = null;
    userFiles = [];
    conversations = [];
    folders = [];
    currentConversationId = null;
    localStorage.removeItem(TOKEN_KEY);
    authUsername.value = '';
    authPassword.value = '';
    settingsOverlay.classList.remove('open');
    setAuthMode('login');
    showAuth();
  }

  async function loadUserFiles() {
    try {
      const res = await fetch('/api/files', { headers: authHeaders() });
      if (!res.ok) { userFiles = []; return; }
      const data = await res.json();
      userFiles = Array.isArray(data.files) ? data.files : [];
    } catch (e) {
      userFiles = [];
    }
  }

  async function loadProfile() {
    const res = await fetch('/api/profile', { headers: authHeaders() });
    if (!res.ok) throw new Error('unauthorized');
    profile = await res.json();
    applyTheme();
    profileAvatarEl.textContent = profile.avatar || '🤖';
    profileNameEl.textContent = profile.displayName || profile.username;
  }

  async function loadFolders() {
    const res = await fetch('/api/folders', { headers: authHeaders() });
    const data = await res.json();
    folders = data.folders || [];
  }

  async function loadConversationsList() {
    const res = await fetch('/api/conversations', { headers: authHeaders() });
    const data = await res.json();
    conversations = data.conversations || [];
  }

  async function openConversation(id) {
    const res = await fetch('/api/conversations/' + id, { headers: authHeaders() });
    if (!res.ok) return false;
    const data = await res.json();
    currentConversationId = id;
    hydrateFromData(data.conversation);
    chatTitleEl.textContent = data.conversation.title;
    renderSidebar();
    if (window.innerWidth < 768) sidebar.classList.remove('mobile-open');
    return true;
  }

  async function createNewConversation() {
    const res = await fetch('/api/conversations', {
      method: 'POST', headers: authHeaders(true), body: JSON.stringify({ title: 'New Chat' })
    });
    const data = await res.json();
    conversations.unshift({ id: data.conversation.id, title: data.conversation.title, folderId: null, createdAt: data.conversation.createdAt, updatedAt: data.conversation.updatedAt, preview: '' });
    await openConversation(data.conversation.id);
  }

  async function loadFromServer() {
    try {
      await loadProfile();
      await loadFolders();
      await loadConversationsList();
      await loadUserFiles();
      if (conversations.length === 0) {
        await createNewConversation();
      } else {
        await openConversation(conversations[0].id);
      }
      showApp();
    } catch (e) {
      logout();
    }
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    const username = authUsername.value.trim();
    const password = authPassword.value;
    authError.textContent = '';
    authSubmitBtn.disabled = true;
    try {
      const res = await fetch('/api/' + authMode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) {
        authError.textContent = data.error || 'Something went wrong.';
        return;
      }
      setToken(data.token);
      await loadFromServer();
    } catch (err) {
      authError.textContent = "Can't reach the server. Is it running?";
    } finally {
      authSubmitBtn.disabled = false;
    }
  }

  // ---------- Sidebar rendering ----------

  function renderSidebar() {
    sidebarList.innerHTML = '';

    const byFolder = {};
    const unfoldered = [];
    conversations.forEach(c => {
      if (c.folderId) {
        (byFolder[c.folderId] = byFolder[c.folderId] || []).push(c);
      } else {
        unfoldered.push(c);
      }
    });

    folders.forEach(folder => {
      const group = document.createElement('div');
      group.className = 'folder-group';

      const header = document.createElement('div');
      header.className = 'folder-header';
      const collapsed = collapsedFolders.has(folder.id);

      const toggleSpan = document.createElement('span');
      toggleSpan.textContent = `${collapsed ? '▶' : '▼'} 📁 `;
      const nameSpan = document.createElement('span');
      nameSpan.textContent = folder.name;
      toggleSpan.appendChild(nameSpan);
      toggleSpan.addEventListener('click', () => {
        if (collapsedFolders.has(folder.id)) collapsedFolders.delete(folder.id);
        else collapsedFolders.add(folder.id);
        renderSidebar();
      });
      header.appendChild(toggleSpan);

      const actions = document.createElement('span');
      actions.className = 'folder-actions';

      const renameBtn = document.createElement('button');
      renameBtn.textContent = '✏️';
      renameBtn.title = 'Rename';
      renameBtn.addEventListener('click', e => {
        e.stopPropagation();
        const input = document.createElement('input');
        input.className = 'conv-title-input';
        input.value = folder.name;
        header.replaceChild(input, toggleSpan);
        input.focus();
        input.select();
        let committed = false;
        function commit() {
          if (committed) return;
          committed = true;
          const newName = input.value.trim() || folder.name;
          folder.name = newName;
          fetch('/api/folders/' + folder.id, { method: 'PATCH', headers: authHeaders(true), body: JSON.stringify({ name: newName }) });
          renderSidebar();
        }
        input.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
          if (ev.key === 'Escape') { committed = true; renderSidebar(); }
        });
        input.addEventListener('blur', commit);
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '🗑️';
      deleteBtn.title = 'Delete folder (chats move to unfoldered)';
      let confirmingFolderDelete = false;
      deleteBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirmingFolderDelete) {
          confirmingFolderDelete = true;
          deleteBtn.textContent = '✓';
          deleteBtn.classList.add('delete-confirm');
          setTimeout(() => {
            if (confirmingFolderDelete) {
              confirmingFolderDelete = false;
              deleteBtn.textContent = '🗑️';
              deleteBtn.classList.remove('delete-confirm');
            }
          }, 3000);
          return;
        }
        fetch('/api/folders/' + folder.id, { method: 'DELETE', headers: authHeaders() }).then(() => {
          folders = folders.filter(f => f.id !== folder.id);
          conversations.forEach(c => { if (c.folderId === folder.id) c.folderId = null; });
          renderSidebar();
        });
      });

      actions.appendChild(renameBtn);
      actions.appendChild(deleteBtn);
      header.appendChild(actions);
      group.appendChild(header);

      if (!collapsed) {
        const children = document.createElement('div');
        children.className = 'folder-children';
        (byFolder[folder.id] || []).forEach(c => children.appendChild(renderConvItem(c)));
        group.appendChild(children);
      }

      sidebarList.appendChild(group);
    });

    unfoldered.forEach(c => sidebarList.appendChild(renderConvItem(c)));
  }

  function renderConvItem(c) {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');

    const title = document.createElement('span');
    title.className = 'conv-title';
    title.textContent = c.title;
    title.addEventListener('click', () => openConversation(c.id));
    item.appendChild(title);

    const actions = document.createElement('div');
    actions.className = 'conv-actions';

    const renameBtn = document.createElement('button');
    renameBtn.textContent = '✏️';
    renameBtn.title = 'Rename';
    renameBtn.addEventListener('click', e => {
      e.stopPropagation();
      startInlineRename(item, title, c);
    });

    const folderSelect = document.createElement('select');
    folderSelect.style.cssText = 'font-size:10px; max-width:50px; border-radius:4px;';
    folderSelect.innerHTML = '<option value="">No folder</option>' +
      folders.map(f => `<option value="${f.id}" ${f.id === c.folderId ? 'selected' : ''}>${escapeHtml(f.name)}</option>`).join('');
    folderSelect.addEventListener('click', e => e.stopPropagation());
    folderSelect.addEventListener('change', () => {
      const folderId = folderSelect.value || null;
      fetch('/api/conversations/' + c.id, { method: 'PATCH', headers: authHeaders(true), body: JSON.stringify({ folderId }) })
        .then(() => { c.folderId = folderId; renderSidebar(); });
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = '🗑️';
    deleteBtn.title = 'Delete';
    let confirmingDelete = false;
    deleteBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirmingDelete) {
        confirmingDelete = true;
        deleteBtn.textContent = '✓';
        deleteBtn.classList.add('delete-confirm');
        setTimeout(() => {
          if (confirmingDelete) {
            confirmingDelete = false;
            deleteBtn.textContent = '🗑️';
            deleteBtn.classList.remove('delete-confirm');
          }
        }, 3000);
        return;
      }
      fetch('/api/conversations/' + c.id, { method: 'DELETE', headers: authHeaders() }).then(async () => {
        conversations = conversations.filter(x => x.id !== c.id);
        if (c.id === currentConversationId) {
          if (conversations.length > 0) await openConversation(conversations[0].id);
          else await createNewConversation();
        } else {
          renderSidebar();
        }
      });
    });

    actions.appendChild(renameBtn);
    actions.appendChild(folderSelect);
    actions.appendChild(deleteBtn);
    item.appendChild(actions);

    return item;
  }

  function startInlineRename(item, titleEl, c) {
    const input = document.createElement('input');
    input.className = 'conv-title-input';
    input.value = c.title;
    item.replaceChild(input, titleEl);
    input.focus();
    input.select();

    let committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      const newTitle = input.value.trim() || c.title;
      c.title = newTitle;
      if (c.id === currentConversationId) chatTitleEl.textContent = newTitle;
      fetch('/api/conversations/' + c.id, { method: 'PATCH', headers: authHeaders(true), body: JSON.stringify({ title: newTitle }) });
      renderSidebar();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { committed = true; renderSidebar(); }
    });
    input.addEventListener('blur', commit);
  }

  let searchDebounce = null;
  sidebarSearch.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const q = sidebarSearch.value.trim();
    if (!q) { searchResultsEl.classList.remove('visible'); searchResultsEl.innerHTML = ''; return; }
    searchDebounce = setTimeout(async () => {
      try {
        const res = await fetch('/api/search?q=' + encodeURIComponent(q), { headers: authHeaders() });
        const data = await res.json();
        renderSearchResults(data.results || []);
      } catch (e) {}
    }, 300);
  });

  function renderSearchResults(results) {
    searchResultsEl.innerHTML = '';
    if (!results.length) {
      searchResultsEl.innerHTML = '<div style="font-size:11px; color:var(--text-secondary); padding:6px;">No matches</div>';
    } else {
      results.forEach(r => {
        const div = document.createElement('div');
        div.className = 'search-result';
        div.innerHTML = `<span class="sr-title">${escapeHtml(r.conversationTitle)}</span><span class="sr-snippet">${escapeHtml(r.snippet)}</span>`;
        div.addEventListener('click', () => {
          openConversation(r.conversationId);
          sidebarSearch.value = '';
          searchResultsEl.classList.remove('visible');
        });
        searchResultsEl.appendChild(div);
      });
    }
    searchResultsEl.classList.add('visible');
  }

  newChatBtn.addEventListener('click', createNewConversation);

  newFolderBtn.addEventListener('click', () => {
    const input = document.createElement('input');
    input.id = 'newFolderInput';
    input.placeholder = 'Folder name';
    newFolderRow.innerHTML = '';
    newFolderRow.appendChild(input);
    input.focus();
    let committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      const name = input.value.trim();
      if (name) {
        fetch('/api/folders', { method: 'POST', headers: authHeaders(true), body: JSON.stringify({ name }) })
          .then(r => r.json()).then(data => { folders.push(data.folder); resetNewFolderRow(); renderSidebar(); });
      } else {
        resetNewFolderRow();
      }
    }
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { committed = true; resetNewFolderRow(); }
    });
    input.addEventListener('blur', commit);
  });

  function resetNewFolderRow() {
    newFolderRow.innerHTML = '<button id="newFolderBtn">+ New Folder</button>';
    document.getElementById('newFolderBtn').addEventListener('click', () => newFolderBtn.click());
  }

  sidebarToggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('mobile-open');
  });

  // ---------- Settings ----------

  AVATARS.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'avatar-option';
    btn.textContent = a;
    btn.type = 'button';
    btn.addEventListener('click', () => {
      avatarGrid.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
      btn.classList.add('selected');
    });
    avatarGrid.appendChild(btn);
  });

  function openSettings() {
    settingsDisplayName.value = profile.displayName || '';
    avatarGrid.querySelectorAll('.avatar-option').forEach(el => {
      el.classList.toggle('selected', el.textContent === profile.avatar);
    });
    themeLightBtn.classList.toggle('selected', profile.theme !== 'dark');
    themeDarkBtn.classList.toggle('selected', profile.theme === 'dark');
    profileMsg.textContent = '';
    passwordMsg.textContent = '';
    currentPasswordInput.value = '';
    newPasswordInput.value = '';
    settingsOverlay.classList.add('open');
  }

  sidebarFooter.addEventListener('click', openSettings);
  closeSettingsBtn.addEventListener('click', () => settingsOverlay.classList.remove('open'));

  themeLightBtn.addEventListener('click', () => {
    themeLightBtn.classList.add('selected');
    themeDarkBtn.classList.remove('selected');
  });
  themeDarkBtn.addEventListener('click', () => {
    themeDarkBtn.classList.add('selected');
    themeLightBtn.classList.remove('selected');
  });

  saveProfileBtn.addEventListener('click', async () => {
    const selectedAvatar = avatarGrid.querySelector('.avatar-option.selected');
    const theme = themeDarkBtn.classList.contains('selected') ? 'dark' : 'light';
    const patch = {
      displayName: settingsDisplayName.value.trim() || profile.displayName,
      avatar: selectedAvatar ? selectedAvatar.textContent : profile.avatar,
      theme
    };
    try {
      const res = await fetch('/api/profile', { method: 'PUT', headers: authHeaders(true), body: JSON.stringify(patch) });
      const data = await res.json();
      if (!res.ok) { profileMsg.textContent = data.error || 'Could not save.'; profileMsg.className = 'settings-msg error'; return; }
      profile = { ...profile, ...data };
      applyTheme();
      profileAvatarEl.textContent = profile.avatar;
      profileNameEl.textContent = profile.displayName;
      profileMsg.textContent = 'Saved!';
      profileMsg.className = 'settings-msg ok';
    } catch (e) {
      profileMsg.textContent = "Couldn't reach the server.";
      profileMsg.className = 'settings-msg error';
    }
  });

  changePasswordBtn.addEventListener('click', async () => {
    const currentPassword = currentPasswordInput.value;
    const newPassword = newPasswordInput.value;
    try {
      const res = await fetch('/api/password', { method: 'PUT', headers: authHeaders(true), body: JSON.stringify({ currentPassword, newPassword }) });
      const data = await res.json();
      if (!res.ok) { passwordMsg.textContent = data.error || 'Could not change password.'; passwordMsg.className = 'settings-msg error'; return; }
      passwordMsg.textContent = 'Password changed!';
      passwordMsg.className = 'settings-msg ok';
      currentPasswordInput.value = '';
      newPasswordInput.value = '';
    } catch (e) {
      passwordMsg.textContent = "Couldn't reach the server.";
      passwordMsg.className = 'settings-msg error';
    }
  });

  settingsLogoutBtn.addEventListener('click', logout);

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot typing-wrap';
    div.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  const rules = [
    { patterns: ['hello', 'hi', 'hey'], replies: ['Hi there! How are you today?', 'Hello! Nice to see you.'] },
    { patterns: ['how are you'], replies: ["I'm just code, but I'm doing great! How about you?"] },
    { patterns: ['your name'], replies: ["I'm Chat Buddy, your friendly bot!"] },
    { patterns: ['bye', 'goodbye'], replies: ['Goodbye! Have a great day!', 'See you later!'] },
    { patterns: ['thanks', 'thank you'], replies: ["You're welcome!"] },
    { patterns: ['joke'], replies: ['Why do programmers prefer dark mode? Because light attracts bugs!'] },
    { patterns: ['weather'], replies: ["I can't check the weather, but I hope it's sunny where you are!"] },
    { patterns: ['time'], replies: [() => `It's currently ${new Date().toLocaleTimeString()}.`] },
    { patterns: ['date', 'today'], replies: [() => `Today's date is ${new Date().toLocaleDateString()}.`] },
    { patterns: ['help'], replies: ['I can chat, do math, tell you the time/date, remember things ("remember that ..."), handle multi-step requests, and read PDF/DOCX/TXT/images you upload (with OCR and object detection for images) — just ask me a question afterward! You can also organize chats into folders, search across all of them, and customize your profile/theme from Settings.'] }
  ];

  const fallbacks = [
    "I'm not sure I understand. Can you rephrase that?",
    "Interesting! Tell me more.",
    "Hmm, I don't have an answer for that yet."
  ];

  function tryMath(text) {
    const match = text.match(/(-?\d+(?:\.\d+)?)\s*([+\-*/])\s*(-?\d+(?:\.\d+)?)/);
    if (!match) return null;
    const [, a, op, b] = match;
    const x = parseFloat(a), y = parseFloat(b);
    let result;
    if (op === '+') result = x + y;
    else if (op === '-') result = x - y;
    else if (op === '*') result = x * y;
    else if (op === '/') result = y !== 0 ? x / y : null;
    if (result === null) return "I can't divide by zero!";
    return `That equals ${result}`;
  }

  function tryName(text) {
    const match = text.match(/my name is (\w+)/i) || text.match(/i'?m (\w+)/i);
    if (match) {
      userName = match[1];
      return `Nice to meet you, ${userName}!`;
    }
    if (/what('?s| is) my name/i.test(text)) {
      return userName ? `Your name is ${userName}!` : "I don't know your name yet. Tell me with 'my name is ...'";
    }
    return null;
  }

  function tryNote(text) {
    const match = text.match(/remember that (.+)/i);
    if (match) {
      notes.push(match[1].trim());
      saveHistory();
      return `Got it, I'll remember: "${match[1].trim()}"`;
    }
    if (/what do you remember|what have i told you/i.test(text)) {
      return notes.length
        ? `Here's what I remember:\n- ${notes.join('\n- ')}`
        : "I don't have anything saved yet. Try 'remember that ...'";
    }
    if (/forget (everything|it all)/i.test(text)) {
      notes = [];
      saveHistory();
      return "Okay, I've forgotten everything you told me to remember.";
    }
    return null;
  }

  const namedColors = [
    { name: 'red', rgb: [220, 20, 20] },
    { name: 'orange', rgb: [230, 130, 30] },
    { name: 'yellow', rgb: [220, 210, 30] },
    { name: 'green', rgb: [40, 160, 60] },
    { name: 'cyan', rgb: [40, 190, 200] },
    { name: 'blue', rgb: [40, 80, 210] },
    { name: 'purple', rgb: [130, 50, 180] },
    { name: 'pink', rgb: [230, 130, 180] },
    { name: 'brown', rgb: [110, 70, 40] },
    { name: 'white', rgb: [240, 240, 240] },
    { name: 'gray', rgb: [130, 130, 130] },
    { name: 'black', rgb: [20, 20, 20] }
  ];

  function closestColorName(r, g, b) {
    let best = null, bestDist = Infinity;
    for (const c of namedColors) {
      const d = (r - c.rgb[0]) ** 2 + (g - c.rgb[1]) ** 2 + (b - c.rgb[2]) ** 2;
      if (d < bestDist) { bestDist = d; best = c.name; }
    }
    return best;
  }

  function analyzeImage(file) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const w = canvas.width = 60;
        const h = canvas.height = 60;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        let r = 0, g = 0, b = 0, count = 0;
        const data = ctx.getImageData(0, 0, w, h).data;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i]; g += data[i + 1]; b += data[i + 2];
          count++;
        }
        r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);

        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        const brightnessLabel = brightness > 180 ? 'bright' : brightness > 90 ? 'medium brightness' : 'dark';
        const orientation = img.naturalWidth > img.naturalHeight ? 'landscape'
          : img.naturalWidth < img.naturalHeight ? 'portrait' : 'square';
        const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');

        resolve({
          width: img.naturalWidth,
          height: img.naturalHeight,
          sizeKb: (file.size / 1024).toFixed(1),
          type: file.type || 'unknown',
          colorName: closestColorName(r, g, b),
          hex,
          brightnessLabel,
          orientation
        });
      };
      img.src = URL.createObjectURL(file);
    });
  }

  function handleImageUpload(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      addImageMessage(e.target.result, 'user');
      const typingEl = showTyping();

      analyzeImage(file).then(info => {
        typingEl.remove();
        const html =
          `<span class="swatch" style="background:${info.hex}"></span>` +
          `Here's what I see:<br>` +
          `Size: ${info.width}×${info.height}px (${info.orientation})<br>` +
          `File size: ${info.sizeKb} KB (${info.type})<br>` +
          `Dominant color: ${info.colorName} (${info.hex})<br>` +
          `Overall tone: ${info.brightnessLabel}`;
        addHtmlMessage(html, 'bot');

        if (authToken) uploadImageForIntelligence(file);
      });
    };
    reader.readAsDataURL(file);
  }

  async function uploadImageForIntelligence(file) {
    const typingEl = showTyping();
    try {
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch('/api/files', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + authToken },
        body: formData
      });
      const data = await res.json();
      typingEl.remove();
      if (!res.ok) {
        addMessage(data.error || "I couldn't run deeper analysis on that image.", 'bot');
        return;
      }
      userFiles.push({ id: data.file.id, name: data.file.name, type: data.file.type, size: data.file.size });
      const meta = data.file.meta || {};
      const uniqueObjects = [...new Set((meta.objects || []).map(o => o.class))];

      let html = `🔎 <b>Deeper analysis</b> (OCR + object detection):<br>${escapeHtml(meta.caption || '')}`;
      if (uniqueObjects.length) {
        html += `<br>Objects detected: ${escapeHtml(uniqueObjects.join(', '))}`;
      }
      if (meta.ocrText) {
        const ocrSnippet = meta.ocrText.slice(0, 300);
        html += `<br>Text found: "${escapeHtml(ocrSnippet)}${meta.ocrText.length > 300 ? '…' : ''}"`;
      }
      html += `<br><button class="preview-btn" onclick="previewFile('${data.file.id}')">👁 Preview</button>`;
      addHtmlMessage(html, 'bot');
      addMessage('This image is saved — ask me anything about it any time.', 'bot');
    } catch (e) {
      typingEl.remove();
      addMessage("I couldn't reach the server for deeper image analysis, but the quick analysis above still applies.", 'bot');
    }
  }

  const DOC_ICONS = { pdf: '📕', docx: '📘', txt: '📃' };
  const IMAGE_TYPES = ['jpg', 'jpeg', 'png', 'bmp', 'gif'];

  async function handleDocUpload(file) {
    if (!file) return;
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!['pdf', 'docx', 'txt'].includes(ext)) {
      addMessage("I can only read PDF, DOCX, or TXT files.", 'bot');
      return;
    }
    if (!authToken) return;
    const typingEl = showTyping();
    try {
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch('/api/files', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + authToken },
        body: formData
      });
      const data = await res.json();
      typingEl.remove();
      if (!res.ok) {
        addMessage(data.error || "Sorry, I couldn't process that file.", 'bot');
        return;
      }
      userFiles.push({ id: data.file.id, name: data.file.name, type: data.file.type, size: data.file.size });
      const icon = DOC_ICONS[data.file.type] || '📄';
      const html =
        `${icon} <b>${escapeHtml(data.file.name)}</b><br>` +
        `${(data.file.size / 1024).toFixed(1)} KB • ${data.file.type.toUpperCase()}<br>` +
        `<button class="preview-btn" onclick="previewFile('${data.file.id}')">👁 Preview</button>`;
      addHtmlMessage(html, 'user');
      addMessage(`Got it! I've stored "${data.file.name}" — ask me anything about it.`, 'bot');
    } catch (e) {
      typingEl.remove();
      addMessage("Sorry, I couldn't reach the server to upload that file.", 'bot');
    }
  }

  window.previewFile = async function (fileId) {
    const meta = userFiles.find(f => f.id === fileId);
    if (!meta || !authToken) return;
    try {
      if (meta.type === 'pdf' || IMAGE_TYPES.includes(meta.type)) {
        const newTab = window.open('', '_blank');
        const res = await fetch('/api/files/' + fileId + '/download', {
          headers: { Authorization: 'Bearer ' + authToken }
        });
        if (!res.ok) {
          if (newTab) newTab.close();
          addMessage("Couldn't load that file for preview.", 'bot');
          return;
        }
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        if (newTab) newTab.location.href = blobUrl;
        else window.open(blobUrl, '_blank');
      } else {
        const res = await fetch('/api/files/' + fileId, {
          headers: { Authorization: 'Bearer ' + authToken }
        });
        if (!res.ok) { addMessage("Couldn't load that file for preview.", 'bot'); return; }
        const data = await res.json();
        const text = data.text || '';
        const snippet = escapeHtml(text.slice(0, 2000)) + (text.length > 2000 ? '…' : '');
        const html =
          `📄 <b>${escapeHtml(meta.name)}</b> (text preview):` +
          `<div class="file-preview-text">${snippet}</div>`;
        addHtmlMessage(html, 'bot');
      }
    } catch (e) {
      addMessage("Couldn't load that file for preview.", 'bot');
    }
  };

  function looksLikeQuestion(text) {
    return /\?\s*$/.test(text.trim()) || /^(what|who|when|where|why|how|does|is|tell me|summarize|explain)\b/i.test(text.trim());
  }

  // Broader than looksLikeQuestion: catches generic "tell me about it"-style
  // requests anywhere in the sentence ("can you verify this and tell me about
  // it"), not just ones that start with a trigger word or end in "?".
  function looksLikeFileIntent(text) {
    const t = text.trim();
    return /\b(verify|analyz|analys|describe|summariz|summaris|inspect|review)\b/i.test(t) ||
      /tell me about (this|it|the file|the document|the image|the pdf|the docx)/i.test(t) ||
      /what('?s| is) (this|it) about/i.test(t) ||
      /what('?s| is) in (this|it|the file|the document|the image)/i.test(t);
  }

  async function getFileOverview() {
    if (!userFiles.length) return "I don't have any files to tell you about yet — upload one first!";
    const mostRecent = userFiles[userFiles.length - 1];
    try {
      const res = await fetch('/api/files/' + mostRecent.id, { headers: { Authorization: 'Bearer ' + authToken } });
      if (!res.ok) return `I have "${mostRecent.name}" stored, but couldn't load its details right now.`;
      const data = await res.json();
      if (data.meta) {
        const objs = [...new Set((data.meta.objects || []).map(o => o.class))];
        let overview = `Here's "${mostRecent.name}": ${data.meta.caption || ''}`;
        if (objs.length) overview += ` Objects detected: ${objs.join(', ')}.`;
        if (data.meta.ocrText) {
          const ocrSnippet = data.meta.ocrText.slice(0, 200);
          overview += ` Text found: "${ocrSnippet}${data.meta.ocrText.length > 200 ? '…' : ''}"`;
        }
        return overview;
      }
      const text = (data.text || '').trim();
      const snippet = text.slice(0, 300);
      return `Here's "${mostRecent.name}": ${snippet}${text.length > 300 ? '…' : ''}`;
    } catch (e) {
      return `I have "${mostRecent.name}" stored, but couldn't load its details right now.`;
    }
  }

  async function tryFileQA(question) {
    try {
      const res = await fetch('/api/ask-files', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + authToken },
        body: JSON.stringify({ question })
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data.answer ? `📄 From "${data.source}": ${data.answer}` : null;
    } catch (e) {
      return null;
    }
  }

  function addVideoMessage(url, sender) {
    const time = timestamp();
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    const video = document.createElement('video');
    video.src = url;
    video.controls = true;
    div.appendChild(video);
    const timeEl = document.createElement('span');
    timeEl.className = 'time';
    timeEl.textContent = time;
    div.appendChild(timeEl);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function formatDuration(sec) {
    if (!isFinite(sec)) return 'unknown';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function analyzeVideo(file) {
    return new Promise((resolve, reject) => {
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.muted = true;
      video.src = URL.createObjectURL(file);

      video.onloadedmetadata = () => {
        video.currentTime = Math.min(1, (video.duration || 0) / 2);
      };

      video.onseeked = () => {
        const canvas = document.createElement('canvas');
        const w = canvas.width = 60;
        const h = canvas.height = 60;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, w, h);

        let r = 0, g = 0, b = 0, count = 0;
        const data = ctx.getImageData(0, 0, w, h).data;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i]; g += data[i + 1]; b += data[i + 2];
          count++;
        }
        r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);

        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        const brightnessLabel = brightness > 180 ? 'bright' : brightness > 90 ? 'medium brightness' : 'dark';
        const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');

        resolve({
          width: video.videoWidth,
          height: video.videoHeight,
          durationLabel: formatDuration(video.duration),
          sizeKb: (file.size / 1024).toFixed(1),
          type: file.type || 'unknown',
          colorName: closestColorName(r, g, b),
          hex,
          brightnessLabel
        });
      };

      video.onerror = () => reject(new Error('Could not load video'));
    });
  }

  function handleVideoUpload(file) {
    if (!file || !file.type.startsWith('video/')) return;
    const url = URL.createObjectURL(file);
    addVideoMessage(url, 'user');
    const typingEl = showTyping();

    analyzeVideo(file).then(info => {
      typingEl.remove();
      const html =
        `<span class="swatch" style="background:${info.hex}"></span>` +
        `Here's what I found in the video:<br>` +
        `Resolution: ${info.width}×${info.height}px<br>` +
        `Duration: ${info.durationLabel}<br>` +
        `File size: ${info.sizeKb} KB (${info.type})<br>` +
        `Frame tone: ${info.brightnessLabel} (dominant color ${info.colorName})`;
      addHtmlMessage(html, 'bot');
    }).catch(() => {
      typingEl.remove();
      addMessage("Sorry, I couldn't analyze that video.", 'bot');
    });
  }

  let webcamStream = null;

  function closeWebcam(overlay) {
    if (webcamStream) {
      webcamStream.getTracks().forEach(t => t.stop());
      webcamStream = null;
    }
    overlay.remove();
  }

  function openWebcam() {
    const overlay = document.createElement('div');
    overlay.id = 'webcamOverlay';
    overlay.innerHTML =
      '<video id="webcamVideo" autoplay playsinline></video>' +
      '<div class="webcam-controls">' +
      '<button id="captureBtn">📸 Capture</button>' +
      '<button id="cancelWebcamBtn">Cancel</button>' +
      '</div>';
    appEl.appendChild(overlay);
    const webcamVideo = overlay.querySelector('#webcamVideo');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        webcamStream = stream;
        webcamVideo.srcObject = stream;
      })
      .catch(err => {
        overlay.remove();
        addMessage("I couldn't access your webcam: " + err.message, 'bot');
      });

    overlay.querySelector('#captureBtn').addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      canvas.width = webcamVideo.videoWidth;
      canvas.height = webcamVideo.videoHeight;
      canvas.getContext('2d').drawImage(webcamVideo, 0, 0);
      canvas.toBlob(blob => {
        const file = new File([blob], 'webcam-photo.png', { type: 'image/png' });
        closeWebcam(overlay);
        handleImageUpload(file);
      }, 'image/png');
    });

    overlay.querySelector('#cancelWebcamBtn').addEventListener('click', () => closeWebcam(overlay));
  }

  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onresult = e => {
      let transcript = '';
      for (let i = 0; i < e.results.length; i++) {
        transcript += e.results[i][0].transcript;
      }
      inputEl.value = transcript;
      if (e.results[e.results.length - 1].isFinal) {
        handleSend();
      }
    };

    recognition.onerror = e => {
      stopListening();
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        addMessage("I couldn't hear that (" + e.error + "). Try typing instead.", 'bot');
      }
    };

    recognition.onend = () => stopListening();
  }

  function startListening() {
    if (!recognition) {
      addMessage("Voice input isn't supported in this browser. Try Chrome or Edge, or just type your question.", 'bot');
      return;
    }
    isListening = true;
    micBtn.classList.add('listening');
    inputEl.placeholder = 'Listening... speak now';
    inputEl.value = '';
    recognition.start();
  }

  function stopListening() {
    isListening = false;
    micBtn.classList.remove('listening');
    inputEl.placeholder = 'Type or paste a screenshot (Ctrl+V)...';
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }
  }

  function getReply(input) {
    const text = input.toLowerCase();

    const nameReply = tryName(input);
    if (nameReply) return nameReply;

    const noteReply = tryNote(input);
    if (noteReply) return noteReply;

    const mathReply = tryMath(text);
    if (mathReply) return mathReply;

    for (const rule of rules) {
      if (rule.patterns.some(p => text.includes(p))) {
        const reply = rule.replies[Math.floor(Math.random() * rule.replies.length)];
        return typeof reply === 'function' ? reply() : reply;
      }
    }

    const fallback = fallbacks[Math.floor(Math.random() * fallbacks.length)];
    return userName ? `${fallback} (${userName})` : fallback;
  }

  // Agent system: breaks a message into sub-tasks and routes each one
  // through the right tool (name/notes/math/rules), tracing its steps.
  function splitTasks(text) {
    return text.split(/\s*,\s*|\s+and\s+|\s+then\s+/i).map(t => t.trim()).filter(Boolean);
  }

  function pickToolName(task) {
    const t = task.toLowerCase();
    if (/remember that|what do you remember|forget/.test(t)) return 'Memory';
    if (/my name is|i'?m \w+|what('?s| is) my name/.test(t)) return 'Name';
    if (/\d+\s*[+\-*/]\s*\d+/.test(t)) return 'Calculator';
    if (/time/.test(t)) return 'Clock';
    if (/date|today/.test(t)) return 'Calendar';
    if (/joke/.test(t)) return 'Joke teller';
    return 'General chat';
  }

  function runAgent(input) {
    const tasks = splitTasks(input);
    if (tasks.length <= 1) {
      return { steps: [], reply: getReply(input) };
    }
    const steps = [];
    const answers = [];
    tasks.forEach((task, i) => {
      const tool = pickToolName(task);
      steps.push(`Step ${i + 1}: "${task}" → using ${tool} tool`);
      answers.push(getReply(task));
    });
    return { steps, reply: answers.join(' ') };
  }

  const EXPLICIT_TOOL_PATTERN = /my name is|i'?m \w+|what('?s| is) my name|remember that|what do you remember|forget (everything|it all)|\d+\s*[+\-*/]\s*\d+/i;

  function handleSend() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    inputEl.value = '';
    sendBtn.disabled = true;

    const typingEl = showTyping();
    setTimeout(async () => {
      typingEl.remove();
      let steps = [];
      let reply;

      const fileIntent = userFiles.length > 0 && looksLikeFileIntent(text);
      const generalQuestion = userFiles.length > 0 && looksLikeQuestion(text);

      if ((fileIntent || generalQuestion) && !EXPLICIT_TOOL_PATTERN.test(text)) {
        const fileAnswer = await tryFileQA(text);
        if (fileAnswer) {
          reply = fileAnswer;
        } else if (fileIntent) {
          // A clear "verify/summarize/describe/tell me about it"-style request
          // with no specific keyword match — give an overview instead of
          // falling through to an unrelated generic chatbot reply.
          reply = await getFileOverview();
        } else {
          // generalQuestion with no match above the relevance threshold: say
          // so explicitly instead of silently falling through to the generic
          // small-talk bot, which would answer confidently but off-topic.
          reply = `I couldn't find anything about that in your uploaded document${userFiles.length > 1 ? 's' : ''}. Could you rephrase, or ask about something else in the file?`;
        }
      } else {
        ({ steps, reply } = runAgent(text));
      }

      if (steps.length) {
        const traceHtml = '🧠 <b>Agent plan:</b>' + steps.map(s => `<div>${s}</div>`).join('');
        addHtmlMessage(traceHtml, 'bot', { extraClass: 'agent-trace' });
      }
      addMessage(reply, 'bot');
      sendBtn.disabled = false;
      inputEl.focus();
    }, 500 + Math.random() * 400);
  }

  sendBtn.addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSend();
  });

  clearBtn.addEventListener('click', () => {
    messagesEl.innerHTML = '';
    userName = null;
    notes = [];
    history = [];
    saveHistory();
    addMessage("Chat cleared! I'm Chat Buddy again. What's your name?", 'bot');
  });

  authForm.addEventListener('submit', handleAuthSubmit);
  authToggle.addEventListener('click', () => setAuthMode(authMode === 'login' ? 'register' : 'login'));

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleImageUpload(fileInput.files[0]);
    fileInput.value = '';
  });

  videoAttachBtn.addEventListener('click', () => videoFileInput.click());
  videoFileInput.addEventListener('change', () => {
    if (videoFileInput.files[0]) handleVideoUpload(videoFileInput.files[0]);
    videoFileInput.value = '';
  });

  webcamBtn.addEventListener('click', openWebcam);

  docAttachBtn.addEventListener('click', () => docFileInput.click());
  docFileInput.addEventListener('change', () => {
    if (docFileInput.files[0]) handleDocUpload(docFileInput.files[0]);
    docFileInput.value = '';
  });

  micBtn.addEventListener('click', () => {
    if (isListening) stopListening();
    else startListening();
  });

  document.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) {
          handleImageUpload(file);
          e.preventDefault();
        }
        break;
      }
    }
  });

  setAuthMode('login');
  if (authToken) {
    loadFromServer();
  } else {
    showAuth();
  }
</script>
